<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tetris+</title>
<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

canvas{
  background:black;
}

#side{
  text-align:left;
}

button{
  width:60px;
  height:60px;
  font-size:20px;
  margin:5px;
}
</style>
</head>
<body>

<h1>テトリス+</h1>

<div class="container">
  <canvas id="game" width="240" height="400"></canvas>

  <div id="side">
    <p>Score: <span id="score">0</span></p>
    <p>Next:</p>
    <canvas id="next" width="80" height="80"></canvas>
  </div>
</div>

<!-- スマホ操作 -->
<div>
  <button onclick="move(-1)">←</button>
  <button onclick="rotate()">⟳</button>
  <button onclick="move(1)">→</button><br>
  <button onclick="drop()">↓</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');

const COL=12, ROW=20, BLOCK=20;

let board = Array.from({length:ROW},()=>Array(COL).fill(0));
let score=0;

const colors=[null,'cyan','blue','orange','yellow','green','purple','red'];

const pieces=[
[],
[[1,1,1,1]],
[[2,0,0],[2,2,2]],
[[0,0,3],[3,3,3]],
[[4,4],[4,4]],
[[0,5,5],[5,5,0]],
[[0,6,0],[6,6,6]],
[[7,7,0],[0,7,7]]
];

let piece, nextPiece;
let pos={x:0,y:0};

function newPiece(){
  piece = nextPiece || pieces[Math.floor(Math.random()*7)+1];
  nextPiece = pieces[Math.floor(Math.random()*7)+1];
  pos={x:4,y:0};
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  board.forEach((row,y)=>{
    row.forEach((v,x)=>{
      if(v){
        ctx.fillStyle=colors[v];
        ctx.fillRect(x*BLOCK,y*BLOCK,BLOCK,BLOCK);
      }
    });
  });

  piece.forEach((row,y)=>{
    row.forEach((v,x)=>{
      if(v){
        ctx.fillStyle=colors[v];
        ctx.fillRect((x+pos.x)*BLOCK,(y+pos.y)*BLOCK,BLOCK,BLOCK);
      }
    });
  });
}

function drawNext(){
  nctx.clearRect(0,0,80,80);
  nextPiece.forEach((row,y)=>{
    row.forEach((v,x)=>{
      if(v){
        nctx.fillStyle=colors[v];
        nctx.fillRect(x*20,y*20,20,20);
      }
    });
  });
}

function collide(){
  return piece.some((row,y)=>
    row.some((v,x)=> v && (board[y+pos.y]?.[x+pos.x]!==0))
  );
}

function merge(){
  piece.forEach((row,y)=>{
    row.forEach((v,x)=>{
      if(v) board[y+pos.y][x+pos.x]=v;
    });
  });
}

function rotate(){
  const r = piece[0].map((_,i)=>piece.map(r=>r[i]).reverse());
  const prev=piece;
  piece=r;
  if(collide()) piece=prev;
}

function move(dir){
  pos.x+=dir;
  if(collide()) pos.x-=dir;
}

function drop(){
  pos.y++;
  if(collide()){
    pos.y--;
    merge();
    clearLines();
    newPiece();
  }
}

function clearLines(){
  let lines=0;
  board=board.filter(row=>{
    if(row.every(v=>v!==0)){
      lines++;
      return false;
    }
    return true;
  });

  while(board.length<ROW){
    board.unshift(Array(COL).fill(0));
  }

  score += lines*100;
  document.getElementById('score').innerText=score;
}

// キーボード
document.addEventListener('keydown',e=>{
  if(e.key==="ArrowLeft") move(-1);
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowDown") drop();
  if(e.key==="ArrowUp") rotate();
});

// なめらかループ
let last=0;
let dropCounter=0;
let dropInterval=500;

function update(time=0){
  const delta=time-last;
  last=time;
  dropCounter+=delta;

  if(dropCounter>dropInterval){
    drop();
    dropCounter=0;
  }

  draw();
  drawNext();
  requestAnimationFrame(update);
}

newPiece();
update();
</script>

</body>
</html>
