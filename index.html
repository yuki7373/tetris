<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2027">

<!-- 👇これが超重要 -->
<link rel="apple-touch-icon" href="icon-192.png">

<title>テトリス</title>
</head>

<style>
body{
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  overflow:hidden;
  touch-action: manipulation;
}

h1{ margin:10px 0; }

#wrapper{
  transform-origin: top center;
  display:flex;
  justify-content:center;
}

.container{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.game-area{
  display:flex;
  gap:20px;
  align-items:flex-start;
  justify-content:center;
}

canvas{
  background:black;
  border-radius:10px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

#game{
  width:240px;
  height:400px;
}

#next{
  width:80px;
  height:80px;
}

button{
  width:60px;
  height:60px;
  font-size:20px;
  margin:5px;
  border-radius:10px;
  border:none;
  background:#ffffff22;
  color:white;
}

.controls{
  margin-top:10px;
}
</style>

</head>

<body>

<h1>テトリス</h1>

<div id="wrapper">
  <div class="container">
    <div class="game-area">
      <canvas id="game" width="240" height="400"></canvas>


  <div id="side">
    <p>Next:</p>
    <canvas id="next" width="80" height="80"></canvas>
    <p>Score: <span id="score">0</span></p>
    <p>High Score: <span id="highscore">0</span></p>
    <p>Level: <span id="level">1</span></p>
  </div>
</div>

<div class="controls">
  <button onclick="move(-1)">←</button>
  <button onclick="rotate()">⟳</button>
  <button onclick="move(1)">→</button><br>
  <button onclick="drop()">↓</button>
  <button onclick="hardDrop()">⬇⬇</button>
  <button id="pauseBtn" onclick="togglePause()">⏸</button>
</div>

  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const nctx = document.getElementById('next').getContext('2d');
const pauseBtn = document.getElementById('pauseBtn');

const COL=12, ROW=20, BLOCK=20;

let board = Array.from({length:ROW},()=>Array(COL).fill(0));
let score=0, level=1;
let dropInterval=500;
let gameOver=false;
let paused=false;

// ハイスコア
let highScore = localStorage.getItem("tetrisHighScore") || 0;
document.getElementById('highscore').innerText = highScore;

const colors=[null,'cyan','blue','orange','yellow','green','purple','red'];

const pieces=[
[],
[[1,1,1,1]],
[[2,0,0],[2,2,2]],
[[0,0,3],[3,3,3]],
[[4,4],[4,4]],
[[0,5,5],[5,5,0]],
[[0,6,0],[6,6,6]],
[[7,7,0],[0,7,7]]
];

let piece, nextPiece;
let pos={x:0,y:0};

function rand(){ return Math.floor(Math.random()*7)+1; }

function newPiece(){
  piece = nextPiece || pieces[rand()];
  nextPiece = pieces[rand()];
  pos={x:4,y:0};

  if(collide()){
    gameOver=true;
    alert("ゲームオーバー！");
    location.reload();
  }
}

function drawBlock(ctx,x,y,v,size=BLOCK){
  ctx.fillStyle=colors[v];
  ctx.fillRect(x*size,y*size,size,size);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  board.forEach((r,y)=>r.forEach((v,x)=>v && drawBlock(ctx,x,y,v)));

  let ghostY=pos.y;
  while(!collide(0,ghostY-pos.y+1)) ghostY++;

  piece.forEach((r,y)=>r.forEach((v,x)=>{
    if(v){
      ctx.globalAlpha=0.3;
      drawBlock(ctx,x+pos.x,y+ghostY,v);
      ctx.globalAlpha=1;
    }
  }));

  piece.forEach((r,y)=>r.forEach((v,x)=>v && drawBlock(ctx,x+pos.x,y+pos.y,v)));
}

function drawNext(){
  nctx.clearRect(0,0,80,80);
  if(!nextPiece) return;

  const size=20;
  const w=nextPiece[0].length;
  const h=nextPiece.length;

  const offsetX=(4-w)/2;
  const offsetY=(4-h)/2;

  nextPiece.forEach((r,y)=>{
    r.forEach((v,x)=>{
      if(v){
        nctx.fillStyle=colors[v];
        nctx.fillRect((x+offsetX)*size,(y+offsetY)*size,size,size);
      }
    });
  });
}

function collide(dx=0,dy=0){
  return piece.some((r,y)=>r.some((v,x)=>
    v && board[y+pos.y+dy]?.[x+pos.x+dx]!==0
  ));
}

function merge(){
  piece.forEach((r,y)=>r.forEach((v,x)=>{
    if(v) board[y+pos.y][x+pos.x]=v;
  }));
}

function rotate(){
  if(paused) return;
  const r = piece[0].map((_,i)=>piece.map(r=>r[i]).reverse());
  const prev=piece;
  piece=r;
  if(collide()) piece=prev;
}

function move(d){
  if(paused) return;
  pos.x+=d;
  if(collide()) pos.x-=d;
}

function drop(){
  if(paused) return;
  pos.y++;
  if(collide()){
    pos.y--;
    merge();
    clear();
    newPiece();
  }
}

function hardDrop(){
  if(paused) return;
  while(!collide(0,1)) pos.y++;
  drop();
}

function clear(){
  let lines=0;
  board=board.filter(r=>{
    if(r.every(v=>v!==0)){ lines++; return false;}
    return true;
  });

  while(board.length<ROW){
    board.unshift(Array(COL).fill(0));
  }

  score+=lines*100;
  level=1+Math.floor(score/500);
  dropInterval=Math.max(100,500-(level*40));

  document.getElementById('score').innerText=score;
  document.getElementById('level').innerText=level;

  if(score > highScore){
    highScore = score;
    localStorage.setItem("tetrisHighScore", highScore);
    document.getElementById('highscore').innerText = highScore;
  }
}

function togglePause(){
  paused = !paused;
  pauseBtn.innerText = paused ? "▶" : "⏸";
}

/* スケール調整 */
function adjustScale(){
  const wrapper=document.getElementById('wrapper');
  const vh=window.innerHeight;
  const contentHeight=wrapper.scrollHeight;
  const scale=Math.min(1, vh/contentHeight);
  wrapper.style.transform=`scale(${scale})`;
}

window.addEventListener('load', adjustScale);
window.addEventListener('resize', adjustScale);

document.addEventListener('keydown',e=>{
  if(e.key==="ArrowLeft") move(-1);
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowDown") drop();
  if(e.key==="ArrowUp") rotate();
  if(e.key===" ") hardDrop();
  if(e.key==="p") togglePause();
});

let last=0, counter=0;

function update(t=0){
  if(gameOver) return;

  if(paused){
    last = t; // ←ここ重要（暴走防止）
    requestAnimationFrame(update);
    return;
  }

  const d=t-last;
  last=t;
  counter+=d;

  if(counter>dropInterval){
    drop();
    counter=0;
  }

  draw();
  drawNext();

  requestAnimationFrame(update);
}

newPiece();
update();
</script>

</body>
</html>
